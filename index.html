<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foto 360° con Giroscopio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@5.0.0/dist/photo-sphere-viewer.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }
    #viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <!-- Caricamento di Three.js come modulo -->
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js';
    import PhotoSphereViewer from 'https://cdn.jsdelivr.net/npm/photo-sphere-viewer@5.0.0/dist/photo-sphere-viewer.min.js';
    import { GyroscopePlugin } from 'https://cdn.jsdelivr.net/npm/photo-sphere-viewer@5.0.0/dist/plugins/gyroscope.min.js';

    const viewer = new PhotoSphereViewer.Viewer({
      container: document.querySelector('#viewer'),
      panorama: 'SV360_01.jpg', // tua immagine qui
      plugins: [
        [GyroscopePlugin, { touchmove: true }]
      ],
    });

    viewer.once('ready', () => {
      console.log('Viewer pronto!');
    });
  </script>
</body>
</html>
